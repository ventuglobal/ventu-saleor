name: CI (pagos)

on:
  pull_request:
    paths:
      - "apps/ventu-pagos/**"
      - ".github/workflows/ci-pagos.yml"
  push:
    branches: [main]
    paths:
      - "apps/ventu-pagos/**"

jobs:
  ventu-pagos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ventu-pagos/requirements.txt pytest
      - name: Compile
        run: python -m py_compile apps/ventu-pagos/ventu_pagos/*.py
      - name: Test
        run: pytest apps/ventu-pagos/tests -q
