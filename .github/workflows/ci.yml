name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ventu-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ventu/requirements.txt pytest
      - name: Compile
        run: python -m py_compile apps/ventu/*.py apps/ventu/catalog/*.py
      - name: Test
        run: pytest apps/ventu/tests -q
