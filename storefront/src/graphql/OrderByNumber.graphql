fragment OrderFullDetails on Order {
	id
	number
	created
	# Decide si la orden se muestra en neto (canal B2B) o con IVA.
	channel {
		slug
	}
	status
	statusDisplay
	paymentStatus
	isPaid
	shippingAddress {
		...AddressDetails
	}
	billingAddress {
		...AddressDetails
	}
	subtotal {
		net {
			amount
			currency
		}
		gross {
			amount
			currency
		}
	}
	shippingPrice {
		net {
			amount
			currency
		}
		gross {
			amount
			currency
		}
	}
	total {
		net {
			amount
			currency
		}
		gross {
			amount
			currency
		}
		tax {
			amount
			currency
		}
	}
	lines {
		id
		quantity
		# Lo pagado por la línea (con el precio por tramo B2B), no el de catálogo.
		totalPrice {
			net {
				amount
				currency
			}
			gross {
				amount
				currency
			}
		}
		variant {
			id
			name
			translation(languageCode: $languageCode) {
				name
			}
			product {
				id
				name
				slug
				translation(languageCode: $languageCode) {
					name
				}
				thumbnail {
					url
					alt
				}
			}
			pricing {
				price {
					net {
						amount
						currency
					}
					gross {
						amount
						currency
					}
				}
			}
		}
	}
	fulfillments {
		id
		status
		created
		trackingNumber
		lines {
			id
			quantity
			orderLine {
				id
			}
		}
	}
}

query OrderByNumber($first: Int, $languageCode: LanguageCodeEnum!) {
	me {
		orders(first: $first) {
			edges {
				node {
					...OrderFullDetails
				}
			}
		}
	}
}
